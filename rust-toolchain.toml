# 固定工具链版本。
#
# docs/TEST_PLAN.md §5「Windows Release 构建可重复」要求构建可复现，
# 因此这里锁定到具体版本而不是 "stable"。
#
# 1.99.0 的选择依据：
#   - edition 2024 需要 1.85+
#   - Electron 不参与 Rust 编译；容器迁移不影响工具链下限（ADR-019）
#   - 1.99.0 是本项目实际构建并跑通全部 DSP 数值测试的 stable 版本
# 注意：这是**实际使用的编译器**；Cargo.toml 的 rust-version 是另一个东西（MSRV 声明）。
#
# 升级方式：修改此处版本号，然后运行一次 `cargo build`，rustup 会自动安装新工具链。
# 升级后**必须**重跑全部 DSP 数值测试与 oracle 交叉验证，因为 LLVM 版本变化
# 可能引起浮点结果的末位差异。

[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["rustfmt", "clippy"]