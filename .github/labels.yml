# Official label set for Auralis Studio.
#
# Apply with:
#   gh api --method PUT repos/dengxingzhi000/auralis-studio/labels/$name \
#     -f color=<hex> -f description=<text>
#
# Colors: red = broken, green = ready, yellow = needs a decision,
# blue = area, grey = housekeeping.
- name: bug
  color: d73a4a
  description: Something behaves differently from what the docs say it does

- name: enhancement
  color: a2eeef
  description: New capability or a change to an existing one

- name: documentation
  color: 0075ca
  description: README, docs/, or ADR changes only

- name: question
  color: d876e3
  description: Usage question - the discussion belongs in Discussions, not Issues

- name: needs-triage
  color: fbca04
  description: Not yet reviewed by a maintainer

- name: needs-decision
  color: fbca04
  description: Blocked on a design or scope decision

- name: good-first-issue
  color: 7057ff
  description: Small, self-contained, and a good way to learn the codebase

- name: help-wanted
  color: 159818
  description: A maintainer would like help on this

- name: wontfix
  color: c2e0c6
  description: Will not be done - the issue stays open so the decision is visible

- name: duplicate
  color: c2e0c6
  description: Already reported elsewhere

- name: stale
  color: c2e0c6
  description: No activity for 60 days

- name: area:dsp
  color: 1d76db
  description: crates/auralis-dsp - RMS, Peak, DC, FFT, STFT, peak detection

- name: area:codec
  color: 1d76db
  description: crates/auralis-codec and crates/auralis-audio - decoding and capture

- name: area:realtime
  color: 1d76db
  description: Audio callback, ring buffer, real-time constraints

- name: area:ui
  color: 1d76db
  description: Tauri / React frontend, rendering, interaction

- name: area:build
  color: 1d76db
  description: Toolchain, CI, packaging

- name: breaking-change
  color: b60205
  description: Breaks an existing interface, format, or documented behavior
