name: CI

# docs/TEST_PLAN.md §7 要求的标准检查集合。
# ADR-019 之后项目是「Rust 音频引擎 + Electron/React 容器」双栈，
# 因此 CI 必须同时覆盖两侧。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------- Rust 主检查
  check:
    name: fmt / clippy / test / release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # Linux 上只需要 ALSA 开发头文件（cpal / auralis-audio）。
      # 迁移到 Electron 后不再需要 GTK/WebKit —— 容器是 Node 进程，
      # 窗口由 Chromium 自己画。
      - name: 安装 Linux 构建依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # ---- 架构边界（AGENTS.md + ADR-018）----
      - name: 架构边界检查
        shell: pwsh
        run: ./scripts/check-boundaries.ps1

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 单元与集成测试
        run: cargo test --workspace --locked

      - name: IPC 载荷实测（ADR-018）
        run: cargo test -p auralis-engine ipc --locked -- --nocapture

      - name: Release 构建
        run: cargo build --workspace --release --locked

      # 引擎是控制台子系统程序，但 PowerShell 直接调用仍不可靠地同步退出码，
      # 统一用 Start-Process -Wait -PassThru。
      - name: Release 产物自检（无窗口）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = "target\release\auralis-engine.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          foreach ($flag in @('--version', '--self-test')) {
            $p = Start-Process -FilePath $exe -ArgumentList $flag -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { Write-Error "$flag exited $($p.ExitCode)"; exit 1 }
          }

  # ---------------------------------------------------------------- 前端
  frontend:
    name: typecheck / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # CI only typechecks/bundles JS; it never launches Electron. Skipping the
      # ~100 MB binary download also lets the Node 20 job (kept because branch
      # protection requires that check name) install on a Node older than
      # Electron 45's engines.node >= 22.12.0. The desktop runtime itself
      # requires 22.12+; see README prerequisites.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: TypeScript 类型检查（渲染进程）
        run: npm run typecheck
      - name: 前端单元测试
        run: npm run test
      - name: TypeScript 类型检查（Electron 主进程）
        run: npm run electron:typecheck
      - name: 打包 Electron 主进程与 preload
        run: npm run electron:build
      - name: 前端构建
        run: npx vite build
      - name: 产物中存在 index.html
        run: test -f dist/index.html

  # ---------------------------------------------------------------- DSP 回归
  dsp-regression:
    name: DSP 数值回归 + numpy oracle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 numpy
        run: python -m pip install numpy

      - name: DSP 单元测试
        run: cargo test -p auralis-dsp --locked -- --nocapture

      # ADR-015：用独立实现交叉验证。scripts/oracle.py 在 CI 中必须真正跑通。
      - name: numpy 参考实现交叉验证
        shell: pwsh
        run: |
          cargo build --release --locked -p auralis-engine
          ./scripts/check-oracle.ps1

      - name: 必需 DSP 测试存在性核对
        shell: pwsh
        run: |
          $required = @(
            'dc_offset_is_the_mean', 'dc_offset_is_signed',
            'silence_produces_zeroes_not_nan',
            'non_finite_samples_are_sanitized_and_counted',
            'over_full_scale_is_counted_not_clipped',
            'flat_topped_waveform_is_detected_as_suspicious',
            'clean_sine_is_not_reported_as_clipping',
            'channel_isolation_l_and_r_are_independent',
            'peak_of_sine_tracks_amplitude',
            'rms_of_sine_is_amplitude_over_sqrt_two',
            'crest_factor_of_full_scale_sine_is_about_3_01_db'
          )
          $out = cargo test -p auralis-dsp --locked -- --list 2>&1 | Out-String
          $missing = @($required | Where-Object { $out -notmatch [regex]::Escape($_) })
          if ($missing.Count -gt 0) {
            Write-Error ("missing required DSP tests: " + ($missing -join ', '))
            exit 1
          }
          Write-Host "all $($required.Count) required DSP tests present"

  # ---------------------------------------------------------------- 构建产物
  artifact:
    name: 上传 Windows Release 产物
    needs: [check]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 构建前端与 Electron 主进程
        working-directory: apps/desktop
        run: |
          npm ci
          npx vite build
          npm run electron:build
      - name: 构建 Rust 音频引擎
        run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: auralis-engine-windows-x64
          path: target/release/auralis-engine.exe
          if-no-files-found: error
