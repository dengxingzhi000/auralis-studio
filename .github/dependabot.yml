# 依赖更新配置（Dependabot）。
#
# 目录均指向清单的真实位置（写错 Dependabot 会静默不工作）：
#   * npm —— apps/desktop 是唯一的 npm 包，lockfile 在 apps/desktop/package-lock.json，
#     仓库根没有 package.json。
#   * cargo —— 仓库根是 workspace（根 Cargo.toml + Cargo.lock），crates/* 下的
#     Cargo.toml 只是工作区成员，版本统一在根 [workspace.dependencies] 声明。
#   * github-actions —— workflow 在 .github/workflows/。
#
# 策略：
#   * 统一每周一次，周一 04:00（Asia/Shanghai）低峰时段。
#   * groups 只把 minor/patch 合成单个 PR（applies-to: version-updates），major 仍单独开。
#   * 每个生态最多 3 个待合并 PR，避免刷满列表。
#   * 默认不写 ignore —— 安全更新必须能提出来（含 minimatch 那条，交由维护者决定）。
#   * 唯一例外是 cargo 的 flacenc 0.5.x：0.5 产出的 FLAC，symphonia 0.6.1 读不了，
#     4 条 FLAC 集成测试会全挂，所以 Cargo.toml 锁在 0.4（见 PR #22 的说明）。
#     不挡住 0.5.x 的话，Dependabot 每次刷新已有的 flacenc PR 都会在 cargo 锁文件
#     校验里抛 "Failed to update flacenc!"，整个 Dependabot Updates run 变红且不产出任何 PR。
version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
    # 只挡 flacenc 的 0.5.x 这一条 minor 线（原因见文件顶部）。
    # 0.4.x 补丁与将来的 0.6+ 仍会照常提 PR；等 symphonia 侧能读 0.5 的 FLAC 后删掉本段即可。
    ignore:
      - dependency-name: flacenc
        versions:
          - ">=0.5.0, <0.6.0"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
