[package]
name = "auralis-desktop"
description = "Auralis Studio 桌面应用（Tauri 外壳 + Rust 音频内核 IPC 端点）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
# Tauri 2 要求库 crate 名与包名一致（mobile 入口需要）
name = "auralis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "auralis-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auralis-audio = { workspace = true }
auralis-codec = { workspace = true }
auralis-core = { workspace = true }
auralis-dsp = { workspace = true }
auralis-storage = { workspace = true }
auralis-task = { workspace = true }
auralis-visualization = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# 刻意不使用 tauri-plugin-log：它会在 setup 阶段调用 log::set_boxed_logger，
# 与 tracing_subscriber 抢同一个全局 logger，导致**打开窗口时 panic**
# （CLI 子命令不走 run()，所以此前从未暴露）。
# 日志出口统一由 lib.rs 的 init_tracing() 负责。
tauri-plugin-dialog = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints.rust]
missing_docs = "warn"
