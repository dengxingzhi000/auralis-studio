[package]
name = "auralis-desktop"
description = "Auralis Studio 桌面应用（Tauri 外壳 + Rust 音频内核 IPC 端点）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
# Tauri 2 要求库 crate 名与包名一致（mobile 入口需要）
name = "auralis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "auralis-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
auralis-codec = { workspace = true }
auralis-core = { workspace = true }
auralis-dsp = { workspace = true }
auralis-task = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints.rust]
missing_docs = "warn"