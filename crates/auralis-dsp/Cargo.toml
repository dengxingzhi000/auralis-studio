[package]
name = "auralis-dsp"
description = "Auralis Studio 纯数值 DSP 内核：窗函数与基础信号指标"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[dependencies]
auralis-core = { workspace = true }
rustfft = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }

# 性能基准。ADR-014 要求「没有基准就无法判断 Rust 是否够快」，
# 而 M0-M3 期间一直没有基准，因此**不能**声称 DSP 性能达标。
#
# 运行：cargo bench -p auralis-dsp
[[bench]]
name = "dsp_bench"
harness = false

[lints.rust]
missing_docs = "warn"