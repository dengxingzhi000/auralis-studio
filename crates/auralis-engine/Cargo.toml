[package]
name = "auralis-engine"
description = "Auralis Studio 音频引擎（Rust 内核 + stdio RPC 端点）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

[lib]
name = "auralis_engine"
crate-type = ["rlib"]

[[bin]]
name = "auralis-engine"
path = "src/main.rs"

[dependencies]
auralis-audio = { workspace = true }
auralis-codec = { workspace = true }
auralis-core = { workspace = true }
auralis-dsp = { workspace = true }
auralis-storage = { workspace = true }
auralis-task = { workspace = true }
auralis-visualization = { workspace = true }
base64 = { workspace = true }
rustfft = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints.rust]
missing_docs = "warn"
